name: Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            patchelf \
            libclang-dev \
            clang \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev

      - name: Point bindgen at libclang
        run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Install frontend packages
        run: bun install --frozen-lockfile

      - name: Build the daemon
        run: cargo build --release -p iris-daemon --bin iris-daemon

      - name: Build the manager
        run: bun run tauri build --bundles deb

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: iris-linux-x86_64
          if-no-files-found: error
          path: |
            target/release/iris
            target/release/iris-daemon
            target/release/bundle/deb/*.deb

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend packages
        run: bun install --frozen-lockfile

      - name: Build the daemon
        run: cargo build --release -p iris-daemon --bin iris-daemon

      - name: Build the manager
        run: bun run tauri build --bundles nsis

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: iris-windows-x86_64
          if-no-files-found: error
          path: |
            target/release/iris.exe
            target/release/iris-daemon.exe
            target/release/bundle/nsis/*.exe

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-binaries
          merge-multiple: false

      - name: Attach binaries to the tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist-binaries/**/*
          generate_release_notes: true
