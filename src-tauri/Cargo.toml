[package]
name = "iris"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Production embeds `dist/` and serves it over the Tauri protocol.
# `tauri dev` turns this off and uses `devUrl` (`http://localhost:1420`).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["net", "io-util", "sync", "process", "time", "rt", "macros"] }
iris-core = { path = "../crates/iris-core" }
iris-pkg = { path = "../crates/iris-pkg" }
tracing = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
